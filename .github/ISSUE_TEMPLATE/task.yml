name: 작업 요청
description: 기능·개선·리팩터링·문서·테스트·설정 작업의 범위와 완료 기준을 정합니다.
body:
  - type: markdown
    attributes:
      value: |
        하나의 작업 목적에 맞춰 작성하고, 구현 전에 이슈를 생성합니다.
        제목은 기존 이슈·PR과 동일하게 `<type>: <한글 중심 설명>`으로 작성합니다.
        type은 feat, fix, refactor, docs, style, test, chore 중 작업 목적에 맞게 고릅니다.
        예: `feat: Android 시스템 Photo Picker 단일 사진 선택 연결`, `chore: 이슈 템플릿과 이슈 기반 작업 흐름 구성`
        API 키·개인정보·실제 사진은 입력하거나 첨부하지 마세요. 예시와 화면 자료에는 합성 데이터를 사용합니다.
  - type: textarea
    id: purpose
    attributes:
      label: 작업 목적
      description: 해결할 문제와 작업 후 기대하는 동작을 적어주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 이번 PR에 포함할 내용과 제외할 내용을 구분해주세요. 큰 작업은 여러 이슈로 나눕니다.
      placeholder: |
        포함:
        -

        제외:
        -
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준
      description: 리뷰어가 확인할 수 있는 동작과 결과를 체크리스트로 적어주세요.
      placeholder: "- [ ] 홈에서 사진 한 장을 선택할 수 있다."
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 검증 계획
      description: 빌드·기본 동작·관련 테스트와 확인할 환경을 적고, 실제 API와 모의 응답 사용 여부를 구분해주세요. 문서 작업은 내용과 링크를 확인합니다.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고 및 선행 작업
      description: Figma 노드·관련 이슈·선행 PR·합의가 필요한 제품 의도 등을 적어주세요. 임시 모델은 확정 API 명세로 취급하지 않습니다.
